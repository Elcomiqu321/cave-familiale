<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#800020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cave Familiale">
  <title>Connexion Cave Familiale</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Cave Familiale</h1>
      <p class="subtitle">Connectez-vous pour accéder à l'inventaire</p>

      <form id="loginForm">
        <label for="personalId">ID personnel</label>
        <input type="text" id="personalId" placeholder="Votre ID" required>

        <label for="cellarKey">Clé de la cave</label>
        <input type="password" id="cellarKey" placeholder="Clé partagée" required>

        <button type="submit">Entrer</button>
        <p id="loginError" class="error-message"></p>
      </form>
      <button type="button" class="install-app-button" id="installAppButton">Installer l’application</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
